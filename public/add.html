<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>提交新项目 - 投标风险哨兵</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 50px auto; padding: 20px; background: #f5f7fa; }
        input, textarea { width: 100%; padding: 12px; margin: 8px 0 20px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; }
        button { background: #1a73e8; color: white; border: none; padding: 14px; border-radius: 8px; width: 100%; font-size: 16px; cursor: pointer; }
        #msg { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
        .note { color: #666; font-size: 14px; margin-top: -10px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <h2>📋 提交新项目到风险监控</h2>
    <p>填完提交后，系统会自动更新监控列表，次日早7:50你会收到推送。</p>
    <p style="color:#d32f2f; background:#ffebee; padding:10px; border-radius:6px;">⚠️ 当前是第一阶段测试，请先不要点击提交按钮（等下一步配置好后再用）</p>
    
    <form id="projectForm">
        <label>项目名称 *</label>
        <input type="text" id="name" required>

        <label>招标单位</label>
        <input type="text" id="buyer">

        <label>截止日期 *</label>
        <input type="date" id="deadline" required>

        <label>风险关键词（用逗号隔开）</label>
        <input type="text" id="keywords" placeholder="例如：保证金, 信用分, 业绩证明">

        <label>备注（选填）</label>
        <textarea id="note" rows="3"></textarea>

        <button type="submit">🚀 提交项目</button>
    </form>
    <div id="msg"></div>

    <script>
        document.getElementById('projectForm').onsubmit = async function(e) {
            e.preventDefault();
            const msg = document.getElementById('msg');
            msg.style.display = 'block';
            msg.style.background = '#fff3cd';
            msg.innerText = '⏳ 提交中，请稍候...';

            const data = {
                name: document.getElementById('name').value,
                buyer: document.getElementById('buyer').value,
                deadline: document.getElementById('deadline').value,
                keywords: document.getElementById('keywords').value.split(',').map(s=>s.trim()).filter(Boolean),
                note: document.getElementById('note').value,
                timestamp: new Date().toISOString()
            };

            // 这里调用你的「免后端中转服务」，下一步教你配置
            const WEBHOOK_URL = 'https://hook.eu1.make.com/eav2mo13rv9hp0um6beel8nb2yhpmp6k'; // 等下一步填

            try {
                const res = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                if (res.ok) {
                    msg.style.background = '#d4edda';
                    msg.innerText = '✅ 提交成功！监控列表已更新，明日推送生效。';
                    document.getElementById('projectForm').reset();
                } else {
                    throw new Error('服务异常');
                }
            } catch (err) {
                msg.style.background = '#f8d7da';
                msg.innerText = '❌ 提交失败，请稍后重试。错误：' + err.message;
            }
        };
    </script>
</body>
</html>
